name: Build & Release (Fabric 26.3)

on:
  push:
    branches:
      - 26.3-fabric
    tags:
      - 'v*'
      - '26.3*'
  pull_request:
    branches:
      - 26.3-fabric
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v26.3-1.14.1 or preview)'
        required: false
        default: 'v26.3-1.14.1'
        type: string
      addon_version:
        description: 'Optional za-horde-optimizer version override (defaults to gradle.properties addon_version)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark GitHub Release as a pre-release (preview)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Download external Fabric config dependencies into libs/
        run: |
          mkdir -p libs
          curl -fL -o libs/ForgeConfigAPIPort-v26.3.1-mc26.3.x-Fabric.jar "https://cdn.modrinth.com/data/ohNO6lps/versions/JpKvrr9J/ForgeConfigAPIPort-v26.3.1-mc26.3.x-Fabric.jar"
          unzip -j -o libs/ForgeConfigAPIPort-v26.3.1-mc26.3.x-Fabric.jar "META-INF/jars/core-3.8.4.jar" "META-INF/jars/toml-3.8.4.jar" -d libs/
          ls -la libs/

      - name: Resolve release metadata
        id: release_meta
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_ADDON_VERSION: ${{ inputs.addon_version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG_NAME=""
          IS_PRERELEASE="false"
          IS_PREVIEW_BRANCH="false"
          GRADLE_VERSION_FLAGS=""
          ADDON_VER="$(printf '%s' "${INPUT_ADDON_VERSION}" | xargs)"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            TAG_VER="${TAG_NAME#v}"
            GRADLE_VERSION_FLAGS="-Prelease=true -Pmod_version=${TAG_VER}"
            if [[ "${TAG_NAME}" =~ -(alpha|beta|rc|preview|snapshot) ]]; then
              IS_PRERELEASE="true"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${INPUT_TAG_NAME:-v26.3-1.14.1}"
            if [[ "${TAG_NAME}" != "preview" ]]; then
              TAG_VER="${TAG_NAME#v}"
              GRADLE_VERSION_FLAGS="-Prelease=true -Pmod_version=${TAG_VER}"
            fi
            if [[ -n "${ADDON_VER}" ]]; then
              GRADLE_VERSION_FLAGS="${GRADLE_VERSION_FLAGS} -Paddon_version=${ADDON_VER}"
            fi
            if [[ "${INPUT_PRERELEASE}" == "true" ]] || [[ "${TAG_NAME}" == "preview" ]] || [[ "${TAG_NAME}" =~ -(alpha|beta|rc|preview|snapshot) ]]; then
              IS_PRERELEASE="true"
            fi
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/26.3-fabric" ]]; then
            IS_PREVIEW_BRANCH="true"
            TAG_NAME="preview"
            IS_PRERELEASE="true"
          fi

          MAKE_LATEST="true"
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            MAKE_LATEST="false"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "is_preview_branch=${IS_PREVIEW_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "gradle_version_flags=${GRADLE_VERSION_FLAGS}" >> "$GITHUB_OUTPUT"

      - name: Build, run JUnit 5 tests & compile testmod
        run: |
          chmod +x gradlew
          ./gradlew clean build :horde-optimizer:build compileTestmodJava ${{ steps.release_meta.outputs.gradle_version_flags }} --no-daemon --console=plain -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Verify built release JARs for ZombieAwareness and za-horde-optimizer
        run: |
          shopt -s nullglob
          main_jars=()
          for f in build/libs/zombieawareness-fabric-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar) continue ;;
            esac
            main_jars+=("$f")
          done
          addon_jars=()
          for f in horde-optimizer/build/libs/za-horde-optimizer-fabric-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar) continue ;;
            esac
            addon_jars+=("$f")
          done

          if [[ ${#main_jars[@]} -eq 0 ]]; then
            echo "ERROR: Missing ZombieAwareness JAR matching build/libs/zombieawareness-fabric-*.jar" >&2
            ls -la build/libs/ || true
            exit 1
          fi
          if [[ ${#addon_jars[@]} -eq 0 ]]; then
            echo "ERROR: Missing za-horde-optimizer JAR matching horde-optimizer/build/libs/za-horde-optimizer-fabric-*.jar" >&2
            ls -la horde-optimizer/build/libs/ || true
            exit 1
          fi

          echo "Verified release JARs:"
          ls -lh "${main_jars[@]}" "${addon_jars[@]}"

      - name: Upload built JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zombieawareness-fabric-26.3-jars
          path: |
            build/libs/zombieawareness-fabric-*.jar
            horde-optimizer/build/libs/za-horde-optimizer-fabric-*.jar
          if-no-files-found: error

      - name: Refresh rolling preview tag & clean stale preview assets
        if: steps.release_meta.outputs.tag_name == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f preview "${{ github.sha }}"
          git push -f origin refs/tags/preview

          if gh release view preview -R "${{ github.repository }}" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -n "$asset" ]] && gh release delete-asset preview "$asset" -R "${{ github.repository }}" -y || true
            done < <(gh release view preview -R "${{ github.repository }}" --json assets --jq '.assets[].name')
          fi

      - name: Publish Preview Release
        if: steps.release_meta.outputs.tag_name == 'preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: ZombieAwareness Preview (26.3-fabric)
          body: |
            Rolling snapshot preview build from `26.3-fabric` at commit `${{ github.sha }}`.
            Includes both **`zombieawareness-fabric`** and companion addon **`za-horde-optimizer-fabric`** built automatically without `-Prelease=true` (carrying the `-snapshot.<shortHash>` suffix).
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/libs/zombieawareness-fabric-*.jar
            horde-optimizer/build/libs/za-horde-optimizer-fabric-*.jar

      - name: Publish GitHub Release
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && steps.release_meta.outputs.tag_name != 'preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ZombieAwareness ${{ steps.release_meta.outputs.tag_name }}
          body: |
            Includes both **`zombieawareness-fabric`** (main mod) and **`za-horde-optimizer-fabric`** (companion horde optimization addon).
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/zombieawareness-fabric-*.jar
            horde-optimizer/build/libs/za-horde-optimizer-fabric-*.jar
