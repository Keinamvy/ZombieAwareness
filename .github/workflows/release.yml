name: Build & Release (Fabric 26.3)

on:
  push:
    branches:
      - 26.3-fabric
    tags:
      - 'v*'
      - '26.3*'
  pull_request:
    branches:
      - 26.3-fabric
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v26.3-1.13.1)'
        required: false
        default: 'v26.3-1.13.1'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Download external Fabric config dependencies into libs/
        run: |
          mkdir -p libs
          curl -fL -o libs/ForgeConfigAPIPort-v26.3.1-mc26.3.x-Fabric.jar "https://cdn.modrinth.com/data/ohNO6lps/versions/JpKvrr9J/ForgeConfigAPIPort-v26.3.1-mc26.3.x-Fabric.jar"
          unzip -j -o libs/ForgeConfigAPIPort-v26.3.1-mc26.3.x-Fabric.jar "META-INF/jars/core-3.8.4.jar" "META-INF/jars/toml-3.8.4.jar" -d libs/
          ls -la libs/

      - name: Build, run JUnit 5 tests & compile testmod
        run: |
          chmod +x gradlew
          ./gradlew clean build compileTestmodJava --no-daemon --console=plain -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload built JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zombieawareness-fabric-26.3-jars
          path: |
            build/libs/zombieawareness-fabric-*.jar
            horde-optimizer/build/libs/za-horde-optimizer-fabric-*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag_name || 'v26.3-1.13.1') || github.ref_name }}
          name: ZombieAwareness ${{ github.event_name == 'workflow_dispatch' && (inputs.tag_name || 'v26.3-1.13.1') || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/zombieawareness-fabric-*.jar
            horde-optimizer/build/libs/za-horde-optimizer-fabric-*.jar
