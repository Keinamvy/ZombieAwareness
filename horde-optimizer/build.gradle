plugins {
	id 'net.fabricmc.fabric-loom'
	id 'maven-publish'
}

version = "26.3-1.0.0"
group = rootProject.maven_group

base {
	archivesName = "za-horde-optimizer-fabric"
}

repositories {
	maven {
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

	def rootModJar = rootProject.tasks.named('jar').map { it.archiveFile.get().asFile }
	compileOnly rootProject.files(rootModJar) {
		builtBy rootProject.tasks.named('jar')
	}
	testImplementation rootProject.files(rootModJar) {
		builtBy rootProject.tasks.named('jar')
	}

	compileOnly files(
		"${rootDir}/libs/ForgeConfigAPIPort-v26.3.1-mc26.3.x-Fabric.jar",
		"${rootDir}/libs/core-3.8.4.jar",
		"${rootDir}/libs/toml-3.8.4.jar"
	)
	runtimeOnly files(
		"${rootDir}/libs/ForgeConfigAPIPort-v26.3.1-mc26.3.x-Fabric.jar",
		"${rootDir}/libs/core-3.8.4.jar",
		"${rootDir}/libs/toml-3.8.4.jar"
	)

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	from("${rootDir}/LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
